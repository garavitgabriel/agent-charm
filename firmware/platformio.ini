; Dex Charm firmware: Waveshare ESP32-S3-Touch-AMOLED-1.8 V2.
; Platform, memory, flash and PSRAM settings are Margin's (margin/firmware/platformio.ini),
; verified on this exact board. See README.md.

[platformio]
default_envs = charm

[env:charm]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I ../ui
  -I src
; The shared UI lives outside this project: lib/charm_ui/library.json compiles ../ui/*.cpp.
lib_deps =
  lvgl/lvgl@8.3.11
  bblanchon/ArduinoJson@7.4.2
  links2004/WebSockets@2.7.3
  charm_ui

; Host-side unit tests for the pure logic in lib/charm_core (no Arduino, no hardware).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_deps =
  bblanchon/ArduinoJson@7.4.2
lib_ignore =
  charm_ui
  waveshare-gfx
  SensorLib
  XPowersLib
