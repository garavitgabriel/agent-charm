[project]
name = "charm-assets"
version = "0.1.0"
description = "Dex Charm asset pipeline: sprite sheets and fonts -> LVGL 8.3 C++ for ui/"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Pinned exactly, like server/. uv.lock pins the transitive set.
dependencies = [
    "lz4==4.4.5",
    "pillow==11.3.0",
    "resvg-py==0.5.0",
]

[project.scripts]
charm-assets = "charm_assets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charm_assets"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
