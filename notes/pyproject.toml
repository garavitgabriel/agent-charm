[project]
name = "charm-notes"
version = "0.0.1"
description = "Dex Charm reading notes store: verbatim thoughts to the OS vault inbox"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charm_notes"]

[dependency-groups]
dev = ["mypy==2.3.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
