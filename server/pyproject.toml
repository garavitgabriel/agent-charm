[project]
name = "charm-server"
version = "0.1.0"
description = "Dex Charm voice/cards server and the charm-client fake device"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Pinned exactly (brief: "pinned deps"). uv.lock pins the transitive set.
dependencies = [
    "charm-notes",
    "edge-tts==7.2.8",
    "faster-whisper==1.2.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "numpy==2.5.3",
    "sounddevice==0.5.6",
    "websockets==17.1",
]

[project.scripts]
charm-server = "charm_server.server:main"
charm-client = "charm_server.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charm_server"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "types-jsonschema==4.26.0.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# REMOTE is a verbatim in-container script adapted from margin/bridge.py.
"src/charm_server/agent.py" = ["E501"]
# Test helpers take per-call recv timeouts on purpose.
"tests/*" = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
# charm_notes (the notes package, a path dependency) ships no py.typed: check it from source.
mypy_path = "src:../notes/src"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "edge_tts.*", "sounddevice.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
charm-notes = { path = "../notes", editable = true }
