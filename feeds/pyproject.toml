[project]
name = "charm-feeds"
version = "0.1.0"
description = "Dex's desk feeds turned into Dex Charm edition/decision cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.25.1",
]

[project.scripts]
charm-feeds = "charm_feeds.cli:main"

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.13.2",
    "types-jsonschema==4.25.1.20250822",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charm_feeds"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
